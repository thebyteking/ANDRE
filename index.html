  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: 80px auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      padding: 0 24px;
      color: white;
      background: #23364d;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    nav {
      z-index: 10;
      background: #354f6b;
    }

    .menu {
      display: flex;
      height: 48px;
      margin: 0;
      padding: 0 12px;
      list-style: none;
    }

    .menu > li {
      position: relative;
    }

    .menu a {
      display: block;
      padding: 15px 18px;
      color: white;
      text-decoration: none;
      white-space: nowrap;
    }

    .menu a:hover,
    .menu a:focus {
      background: #526f8c;
    }

    .submenu {
      position: absolute;
      top: 100%;
      left: 0;
      display: none;
      min-width: 210px;
      margin: 0;
      padding: 0;
      list-style: none;
      background: #354f6b;
    }

    .menu li:hover > .submenu,
    .menu li:focus-within > .submenu {
      display: block;
    }

    main {
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  </nav>
