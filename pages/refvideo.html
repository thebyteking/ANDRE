<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Video List</title>
  <style>
    .layout {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
    }

    #videoscreen {
      width: min(70vw, 900px);
      aspect-ratio: 16 / 9;
      background: #111;
      flex: 0 1 900px;
    }

    #videoscreen iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #video-list {
      margin: 0;
      padding-left: 1.25rem;
    }

    #video-list li {
      margin: 0 0 0.75rem;
    }

    @media (max-width: 700px) {
      .layout {
        flex-direction: column;
      }

      #videoscreen {
        width: 100%;
        flex: none;
      }
    }
  </style>
</head>
<body>
  <font face=arial>
  <h1>Useful Videos</h1>

  <div class="layout">
    <div id="videoscreen" aria-label="Video player"></div>
    <ul id="video-list"></ul>
  </div>

  <script>
    const videos = [
      {
        title: "Getting from the Schipol airport to downtown",
        url: "https://youtu.be/RKtnyCbO8jk"
      },
      {
        title: "Amsterdam Mistakes Tourists Make ",
        url: "https://youtu.be/JKu8uccjNUs"
      },
      {
        title: "Maastricht Top Ten Things To Do",
        url: "https://youtu.be/IyIuvA1wdXo"
       },
	   {
	       title: "Maastricht Travel Guide",
	       url: "https://youtu.be/_OtshbwARec"
	    },
	   {
	       title: "Crossing the EU border",
	       url: "https://youtu.be/VNBj7Pw74B4"
	    },
	   {
	       title: "Andre Rieu Best",
	       url: "https://youtu.be/VXG8QUW27ag"
	    }

    ];








    const videoList = document.getElementById("video-list");
    const videoScreen = document.getElementById("videoscreen");

    function getYouTubeId(url) {
      try {
        const parsedUrl = new URL(url);
        const host = parsedUrl.hostname.replace(/^www\./, "");

        if (host === "youtu.be") {
          return parsedUrl.pathname.slice(1);
        }

        if (host === "youtube.com" || host === "m.youtube.com") {
          if (parsedUrl.pathname === "/watch") {
            return parsedUrl.searchParams.get("v");
          }

          const match = parsedUrl.pathname.match(/^\/(?:embed|shorts)\/([^/]+)/);
          return match ? match[1] : null;
        }
      } catch {
        return null;
      }

      return null;
    }

    videos.forEach((video) => {
      const item = document.createElement("li");
      const link = document.createElement("a");

      link.href = video.url;
      link.textContent = video.title;

      link.addEventListener("click", (event) => {
        event.preventDefault();

        const videoId = getYouTubeId(video.url);
        if (!videoId) {
          alert("That doesn't look like a supported YouTube URL.");
          return;
        }

        const iframe = document.createElement("iframe");
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.src =
          `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1`;
        iframe.title = video.title;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;

        videoScreen.replaceChildren(iframe);
      });

      item.appendChild(link);
      videoList.appendChild(item);
    });
  </script>
</body>
</html>
