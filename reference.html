<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REFERENCE</title>
  <style>
    .viewer {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    #imageList {
      margin: 0;
      padding-left: 20px;
    }

    #imageList button {
      padding: 4px 0;
      border: 0;
      background: none;
      color: #06c;
      font: inherit;
      text-align: left;
      text-decoration: underline;
      cursor: pointer;
    }

#preview {
  box-sizing: border-box;
  width: 800px;
  height: 400px;
  border: 1px solid #aaa;
  overflow-x: scroll;
  overflow-y: auto;
}
#preview img {
  display: block;
  max-width: none;
  max-height: none;
}
</style>
</head>
<body>
  <div class="viewer">
  <font face=arial size=2>
  This list represents all the "paid" items/events in out trip.
  Use this list in case we need to prove our right to the events.
    <ul id="imageList"></ul>
    <div id="preview" aria-live="polite">Select an image</div>
  </div>

  <script>
    // Add your image filenames here. Files are expected in ../img/.
    const images = [
      "rieu_concert.png",
      "terrace_pgm.png",
      "bastion.png",
      "clayton_receipt.png"
    ];

    const list = document.querySelector("#imageList");
    const preview = document.querySelector("#preview");

    images.forEach((filename) => {
      const item = document.createElement("li");
      const button = document.createElement("button");

      button.type = "button";
      button.textContent = filename;
      button.addEventListener("click", () => {
        const image = document.createElement("img");
        image.src = `../img/${encodeURIComponent(filename)}`;
        image.alt = filename;

        preview.replaceChildren(image);
      });

      item.append(button);
      list.append(item);
    });
  </script>
</body>
</html>
